<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OWASP Security Lab{% endblock %}</title>
    <style>
        body {
            max-width: 900px;
            margin: 48px auto;
            padding: 0 24px;
            color: #1f2937;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }
        a { color: #1d4ed8; }
        h1 { color: #0f172a; }
        nav { margin-bottom: 28px; }
        .notice {
            padding: 14px 18px;
            border-left: 4px solid #d97706;
            background: #fffbeb;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 28px;
        }
        .card {
            padding: 20px;
            border: 1px solid #dbe3ee;
            border-radius: 10px;
            background: white;
        }
        .status { color: #64748b; }
        .danger { color: #b91c1c; }
        .safe { color: #047857; }
        code {
            padding: 2px 5px;
            border-radius: 4px;
            background: #e2e8f0;
        }
        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font: inherit;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            margin: 5px 0 14px;
            padding: 10px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font: inherit;
        }
        button {
            margin-top: 10px;
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #1d4ed8;
            cursor: pointer;
        }
        .comment {
            margin-top: 12px;
            padding: 12px;
            border-left: 4px solid #94a3b8;
            background: white;
            overflow-wrap: anywhere;
        }
        .result {
            margin: 16px 0;
            padding: 12px 14px;
            border-left: 4px solid #b91c1c;
            background: #fef2f2;
        }
        .result.success {
            border-left-color: #047857;
            background: #ecfdf5;
        }
    </style>
</head>
<body>
    <nav><a href="{{ url_for('index') }}">Home</a></nav>
    {% block content %}{% endblock %}
</body>
</html>
